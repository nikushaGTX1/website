<div class="avatar" [class.gym-active]="wearsGymOutfit">
  <div class="character-stage">
    <img src="/round-limb-character.svg" alt="Your personalized lifestyle character" />
    <div class="gym-shirt" *ngIf="wearsGymOutfit" aria-label="Gym outfit">
      <span>GYM</span>
    </div>
  </div>
  <p *ngIf="showSummary">{{ summary }}</p>
</div>
