<div class="avatar" [class.gym-active]="wearsGymOutfit" [class.portrait]="portrait">
  <img *ngIf="portraitScene; else characterLayers" class="portrait-scene" [src]="portraitScene" (error)="onPortraitError()" alt="Illustrated household portrait" />
  <ng-template #characterLayers>
  <div
    class="character-stage"
    [class.character-group]="characterFigures.length > 1"
    [class.crowded-group]="characterFigures.length > 4"
    [class.has-extra-people]="extraPeople > 0"
    [class.has-children]="profile.children > 0"
  >
    <ng-container *ngIf="characterFigures.length; else chooseGender">
      <span
        class="character-figure"
        *ngFor="let figure of characterFigures"
        [class.adult-figure]="figure.role === 'adult'"
        [class.couple-figure]="figure.role === 'couple'"
        [class.child-figure]="figure.role === 'child'"
        [class.school-age-figure]="figure.ageGroup === 'Age7To12'"
        [class.teen-figure]="figure.ageGroup === 'Age13To17'"
        [class.pet-figure]="figure.role === 'pet'"
        [class.female-figure]="figure.gender === 'Female'"
        [class.variant-figure]="variantFigureSrc(figure) !== figure.src"
      >
        <img
          [src]="variantFigureSrc(figure)"
          [alt]="profile.householdType ? '' : profile.gender + ' personalized lifestyle character'"
        />
      </span>
      <span
        class="extra-adults"
        *ngIf="extraPeople"
        [attr.aria-label]="extraPeople + ' more people'"
      >
        <svg aria-hidden="true"><use href="/ai-match-icons.svg#company"></use></svg>
        <b>+{{ extraPeople }}</b>
      </span>
    </ng-container>
    <ng-template #chooseGender
      ><span class="avatar-placeholder">Choose Male or Female</span></ng-template
    >
  </div>
  </ng-template>
  <p *ngIf="showSummary">{{ summary }}</p>
</div>
