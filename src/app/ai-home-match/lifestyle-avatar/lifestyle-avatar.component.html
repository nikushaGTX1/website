<div class="avatar" [class.gym-active]="wearsGymOutfit">
  <div class="character-stage" [class.character-group]="characterFigures.length > 1">
    <ng-container *ngIf="characterFigures.length; else chooseGender">
      <span
        class="character-figure"
        *ngFor="let figure of characterFigures"
        [class.child-figure]="figure.role === 'child'"
        [class.pet-figure]="figure.role === 'pet'"
      >
        <img
          [src]="variantFigureSrc(figure)"
          [alt]="profile.householdType ? '' : profile.gender + ' personalized lifestyle character'"
        />
      </span>
    </ng-container>
    <ng-template #chooseGender><span class="avatar-placeholder">Choose Male or Female</span></ng-template>
  </div>
  <p *ngIf="showSummary">{{ summary }}</p>
</div>
