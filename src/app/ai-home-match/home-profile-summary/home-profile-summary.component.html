<section class="summary">
  <header class="summary-header">
    <span class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles"></i> Profile ready</span>
    <h1>This is your lifestyle profile</h1>
    <p>Your answers shape a unique home search, built around the way you live.</p>
  </header>

  <div class="profile-stage">
    <div class="ambient-ring ring-one"></div>
    <div class="ambient-ring ring-two"></div>

    <article
      class="profile-attribute orbit-attribute"
      *ngFor="let attribute of profileAttributes"
      [style.left.%]="attribute.left"
      [style.top.%]="attribute.top"
    >
      <span class="attribute-icon"><i class="fa-solid" [ngClass]="attribute.icon"></i></span>
      <p><small>{{ attribute.label }}</small><strong>{{ attribute.value }}</strong></p>
    </article>

    <div class="avatar-focus">
      <div class="avatar-glow"></div>
      <app-velven-lifestyle-avatar [profile]="profile"></app-velven-lifestyle-avatar>
      <span class="avatar-caption"><i class="fa-solid fa-wand-magic-sparkles"></i> Your Velven character</span>
    </div>
  </div>

  <section class="answer-review" aria-label="Your answers">
    <h2>Review your answers</h2>
    <ul>
      <li *ngFor="let row of answers">
        <div class="answer-head">
          <span class="answer-icon"><i class="fa-solid" [ngClass]="row.icon" aria-hidden="true"></i></span>
          <small>{{ row.label }}</small>
        </div>
        <strong class="answer-value">{{ row.value }}</strong>
        <button type="button" (click)="changeAnswer.emit(row.step)">Change</button>
      </li>
    </ul>
  </section>

  <p class="save-message" aria-live="polite">{{ saveMessage }}</p>
  <div class="actions">
    <button type="button" class="secondary" (click)="edit.emit()"><i class="fa-solid fa-pen"></i> Edit My Answers</button>
    <button type="button" class="secondary" (click)="save.emit()" [disabled]="saving"><i class="fa-regular fa-bookmark"></i> {{ saving ? 'Saving…' : 'Save My Profile' }}</button>
    <button type="button" class="primary" (click)="submitProfile.emit()">Find My Best Matches <i class="fa-solid fa-arrow-right"></i></button>
  </div>
</section>
