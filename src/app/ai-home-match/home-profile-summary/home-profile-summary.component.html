<section class="summary">
  <header class="summary-header">
    <span class="eyebrow"><i class="fa-solid fa-wand-magic-sparkles"></i> Profile ready</span>
    <h1>This is your lifestyle profile</h1>
    <p>Your answers shape a unique home search, built around the way you live.</p>
  </header>

  <div class="profile-stage">
    <div class="ambient-ring ring-one"></div>
    <div class="ambient-ring ring-two"></div>

    <button
      type="button"
      class="profile-attribute orbit-attribute"
      *ngFor="let attribute of profileAttributes; trackBy: trackAttribute"
      [style.left.%]="attribute.left"
      [style.top.%]="attribute.top"
      (click)="changeAnswer.emit(attribute.step)"
    >
      <span class="attribute-icon"><i class="fa-solid" [ngClass]="attribute.icon" aria-hidden="true"></i></span>
      <span class="attribute-text"><small>{{ attribute.label }}</small><strong>{{ attribute.value }}</strong></span>
      <span class="attribute-edit" aria-hidden="true"><i class="fa-solid fa-pen"></i></span>
    </button>

    <div class="avatar-focus">
      <div class="avatar-glow"></div>
      <app-velven-lifestyle-avatar [profile]="profile"></app-velven-lifestyle-avatar>
      <span class="avatar-caption"><i class="fa-solid fa-wand-magic-sparkles"></i> Your Velven character</span>
    </div>
  </div>

  <!-- Answers that do not fit the orbit; shown on every screen so each answer stays one tap from editing. -->
  <div class="extra-answers">
    <button
      type="button"
      class="profile-attribute extra-attribute"
      *ngFor="let attribute of mobileExtraAttributes; trackBy: trackAttribute"
      (click)="changeAnswer.emit(attribute.step)"
    >
      <span class="attribute-icon"><i class="fa-solid" [ngClass]="attribute.icon" aria-hidden="true"></i></span>
      <span class="attribute-text"><small>{{ attribute.label }}</small><strong>{{ attribute.value }}</strong></span>
      <span class="attribute-edit" aria-hidden="true"><i class="fa-solid fa-pen"></i></span>
    </button>
  </div>


  <p class="save-message" aria-live="polite">{{ saveMessage }}</p>
  <div class="actions">
    <button type="button" class="secondary" (click)="edit.emit()"><i class="fa-solid fa-pen"></i> Edit My Answers</button>
    <button type="button" class="secondary" *ngIf="!confirmReset" (click)="confirmReset = true"><i class="fa-solid fa-rotate-left"></i> Reset Profile</button>
    <button type="button" class="secondary danger" *ngIf="confirmReset" (click)="confirmReset = false; reset.emit()"><i class="fa-solid fa-rotate-left"></i> Yes, reset everything</button>
    <button type="button" class="secondary" *ngIf="confirmReset" (click)="confirmReset = false">Cancel</button>
    <button type="button" class="primary" (click)="submitProfile.emit()">Find My Best Matches <i class="fa-solid fa-arrow-right"></i></button>
  </div>
</section>
