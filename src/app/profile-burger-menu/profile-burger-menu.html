<div class="profile-burger-wrapper">
  <button class="profile-burger" type="button" aria-label="Open account menu"
    [attr.aria-expanded]="isOpen" (click)="toggleMenu()">
    <span class="avatar-sm">
      <img *ngIf="profileImage" [src]="profileImage" alt="Profile" (error)="fixProfileImage($event)">
      <i *ngIf="!profileImage" class="fa-regular fa-user" aria-hidden="true"></i>
    </span>
    <span class="account-label">Account</span>
    <span class="account-dot" *ngIf="isClient && newMatches > 0" aria-hidden="true"></span>
    <i class="menu-chevron fa-solid fa-chevron-down" aria-hidden="true"></i>
  </button>

  <div class="burger-menu" [class.open]="isOpen">
    <div class="menu-profile">
      <div class="avatar-lg">
        <img *ngIf="profileImage" [src]="profileImage" alt="Profile" (error)="fixProfileImage($event)">
        <i *ngIf="!profileImage" class="fa-regular fa-user" aria-hidden="true"></i>
      </div>
      <div><div class="name">{{ user?.fullName || 'My account' }}</div>
        <div class="pin">{{ userPinLabel || '' }}</div></div>
    </div>
    <div class="menu-divider"></div>

    <ul class="menu-list">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" [class.featured]="item.featured" (click)="closeMenu()">
          <i [class]="item.icon" aria-hidden="true"></i>
          <span class="item-label">{{ item.label }}</span>
          <span class="item-badge" *ngIf="item.badge">{{ item.badge > 99 ? '99+' : item.badge }}</span>
        </a>
      </li>
      <li class="sep" aria-hidden="true"></li>
      <li class="logout">
        <button type="button" aria-label="Log out" (click)="logout()">
          <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
          Log out
        </button>
      </li>
    </ul>
  </div>
</div>
