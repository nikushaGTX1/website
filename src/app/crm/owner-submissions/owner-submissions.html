<main class="page">
  <header class="top">
    <div>
      <a class="back" routerLink="/my-listings"><i class="fa-solid fa-arrow-left"></i> My listings</a>
      <h1>Owner submissions</h1>
      <p>Properties owners sent through your links. Call, visit, verify, then publish.</p>
    </div>
    <button type="button" class="icon-btn" (click)="load()" [disabled]="loading" aria-label="Refresh"><i class="fa-solid fa-rotate-right" [class.fa-spin]="loading"></i></button>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button type="button" [class.active]="filter === 'all'" (click)="filter = 'all'">All <b>{{ count('all') }}</b></button>
      <button type="button" *ngFor="let s of statuses" [class.active]="filter === s.value" [attr.data-status]="s.value" (click)="filter = s.value">{{ s.label }} <b>{{ count(s.value) }}</b></button>
    </div>
    <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input [(ngModel)]="search" placeholder="Search name, phone, district"></label>
  </div>

  <p class="banner error" *ngIf="error"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</p>

  <div class="state" *ngIf="loading && !submissions.length"><span class="spinner"></span>Loading submissions…</div>
  <div class="state empty" *ngIf="!loading && !submissions.length">
    <i class="fa-regular fa-folder-open"></i><h2>No submissions yet</h2><p>Send an owner link from the CRM. Their answers appear here.</p>
  </div>

  <section class="layout" *ngIf="submissions.length">
    <div class="list">
      <p class="none" *ngIf="!visible.length">Nothing matches this filter.</p>
      <button type="button" class="row" *ngFor="let item of visible" (click)="open(item)">
        <div class="thumb">
          <img *ngIf="item.photos.length; else noPhoto" [src]="item.photos[0]" alt="" loading="lazy">
          <ng-template #noPhoto><i class="fa-regular fa-image"></i></ng-template>
          <span class="count" *ngIf="item.photos.length > 1"><i class="fa-solid fa-camera"></i>{{ item.photos.length }}</span>
        </div>
        <div class="row-body">
          <div class="row-top">
            <span class="status" [attr.data-status]="item.status">{{ statusLabel(item.status) }}</span>
            <span class="deal">{{ item.dealType === 'Rent' ? 'Rent' : 'Sale' }}</span>
          </div>
          <strong class="row-price">{{ price(item) }}</strong>
          <span class="row-address"><i class="fa-solid fa-location-dot"></i>{{ address(item) }}</span>
          <span class="row-owner"><i class="fa-solid fa-user"></i>{{ item.ownerName }} · {{ item.createdAt | date:'MMM d, HH:mm' }}</span>
        </div>
      </button>
    </div>

  </section>
</main>
