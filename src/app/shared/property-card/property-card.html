<article class="property-card" [routerLink]="['/apartments', apartment.id]">
  <div class="property-image" data-protected-image>
    <span class="property-badge verified" *ngIf="verified" title="A Velven agent has checked this property in person."
      ><i class="fa-solid fa-circle-check"></i> Verified</span
    >
    <img [src]="image | photoUrl" [alt]="apartment | listingTitle" width="640" height="400" loading="lazy" decoding="async" draggable="false" (error)="onImageError($event)" />
    <button
      type="button"
      class="favorite"
      [class.active]="favorites.isFavorite(apartment.id)"
      [attr.aria-label]="favorites.isFavorite(apartment.id) ? 'Remove from saved properties' : 'Save property'"
      [attr.aria-pressed]="favorites.isFavorite(apartment.id)"
      (click)="toggleFavorite($event)"
    >
      <i [class]="favorites.isFavorite(apartment.id) ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"></i>
    </button>
  </div>
  <div class="property-info">
    <h3><app-currency-price [usdPrice]="apartment.price" [suffix]="isSale ? '' : '/ month'"></app-currency-price></h3>
    <strong class="property-title">{{ apartment | listingTitle }}</strong>
    <p class="property-address"><i class="fa-solid fa-location-dot"></i> {{ location }}</p>
    <div class="property-meta">
      <span *ngIf="apartment.rooms"><i class="fa-solid fa-door-open"></i>{{ apartment.rooms }} <span>rooms</span></span>
      <span><i class="fa-solid fa-bed"></i>{{ apartment.bedrooms || '—' }} Beds</span>
      <span *ngIf="apartment.floor != null"><i class="fa-solid fa-stairs"></i>{{ apartment.floor }} <span>Floor</span></span>
      <span><span class="measurement-svg" aria-hidden="true"></span>{{ apartment.sizeSquareMeters || '—' }} m²</span>
    </div>
    <div class="nearby" *ngIf="nearby.length">
      <span class="nearby-label">Nearby</span>
      <div class="nearby-grid">
        <span *ngFor="let place of nearby"><i [class]="place.icon"></i><b>{{ place.label }}</b><small>{{ place.detail }}</small></span>
      </div>
    </div>
    <span class="view-details">View details <i class="fa-solid fa-arrow-right"></i></span>
  </div>
</article>
