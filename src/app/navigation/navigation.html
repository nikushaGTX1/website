<header class="site-header">
  <nav class="navigation" aria-label="Main navigation">
    <a class="brand" routerLink="/main" aria-label="Velven home" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <img src="/logosh2-small.png" width="128" height="86" alt="" />
      </span>
      <span class="brand-name" aria-hidden="true">VELVEN</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-label]="menuOpen ? 'Close navigation' : 'Open navigation'"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-navigation"
      (click)="menuOpen = !menuOpen"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="navigation-content" id="mobile-navigation" [class.is-open]="menuOpen">
      <div class="nav-links">
        <a routerLink="/ExploreProperty" [queryParams]="{ mode: 'buy' }" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Buy</a>
        <a routerLink="/ExploreProperty" [queryParams]="{ mode: 'rent' }" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Rent</a>
        <a class="ai-link" routerLink="/ai-home-match" routerLinkActive="active" (click)="closeMenu()">
          AI Match <span aria-hidden="true">✦</span>
        </a>
        <a routerLink="/agent-profile" routerLinkActive="active" (click)="closeMenu()">Agents</a>
        <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
        <a routerLink="/blog" routerLinkActive="active" (click)="closeMenu()">Blog</a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      </div>

      <div class="nav-actions">
        <a class="admin-link" routerLink="/admin" *ngIf="canOpenAdmin" (click)="closeMenu()">Dashboard</a>

        <div class="language-picker" data-no-translate>
          <button
            class="language"
            type="button"
            aria-label="Select language"
            [attr.aria-expanded]="languageOpen"
            (click)="languageOpen = !languageOpen"
          >
            {{ translation.label() }}
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m6 8 4 4 4-4" />
            </svg>
          </button>
          <div class="language-menu" *ngIf="languageOpen">
            <button type="button" (click)="selectLanguage('en')">EN <span>English</span></button>
            <button type="button" (click)="selectLanguage('ka')">GE <span>ქართული</span></button>
          </div>
        </div>

        <a class="sign-in" routerLink="/login" *ngIf="!isLoggedIn" (click)="closeMenu()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 20c.4-4 2.7-6 7-6s6.6 2 7 6" />
          </svg>
          Sign in
        </a>

        <app-profile-burger-menu *ngIf="isLoggedIn"></app-profile-burger-menu>

        <a class="list-property" routerLink="/upload-apartment" (click)="closeMenu()">List your property</a>
      </div>
    </div>
  </nav>
</header>
