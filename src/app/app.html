<a
  class="skip-link"
  href="#main-content"
  *ngIf="showNavigation"
>
  Skip to main content
</a>

<app-navigation
  *ngIf="showNavigation"
  [class.explore-navigation]="isExploreProperty"
></app-navigation>

<div
  id="main-content"
  class="route-content"
  [class.explore-route]="isExploreProperty"
  tabindex="-1"
>
  <router-outlet></router-outlet>
</div>

<app-footer
  *ngIf="showNavigation"
></app-footer>
