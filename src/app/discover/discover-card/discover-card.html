<article class="discover-card" [class.highlighted]="highlighted" [attr.id]="'match-' + apartment.id">
  <a class="card-image" [routerLink]="['/apartments', apartment.id]" (click)="opened.emit(apartment)" data-protected-image>
    <img [src]="image" [alt]="(apartment.title | listingTitle) || 'Property in Tbilisi'" loading="lazy" decoding="async" (error)="onImageError($event)" />
    <span class="card-badges">
      <span class="badge new" *ngIf="isNew"><i class="fa-solid fa-star" aria-hidden="true"></i> New match</span>
      <span class="badge check" *ngIf="needsCheck"><i class="fa-regular fa-circle-question" aria-hidden="true"></i> Confirm details</span>
    </span>
  </a>
  <button
    type="button"
    class="card-heart"
    [class.active]="favorites.isFavorite(apartment.id)"
    [attr.aria-pressed]="favorites.isFavorite(apartment.id)"
    [attr.aria-label]="favorites.isFavorite(apartment.id) ? 'Remove from saved properties' : 'Save property'"
    (click)="toggleFavorite($event)"
  >
    <i [class]="favorites.isFavorite(apartment.id) ? 'fa-solid fa-heart' : 'fa-regular fa-heart'" aria-hidden="true"></i>
  </button>
  <div class="card-body">
    <app-currency-price [usdPrice]="apartment.price" [suffix]="isSale ? '' : '/ month'"></app-currency-price>
    <h3>{{ (apartment.title | listingTitle) || 'Apartment in Tbilisi' }}</h3>
    <p class="location"><i class="fa-solid fa-location-dot" aria-hidden="true"></i><span>{{ location }}</span></p>
    <div class="specs">
      <span><i class="fa-solid fa-bed" aria-hidden="true"></i>{{ apartment.bedrooms || '—' }} Beds</span>
      <span *ngIf="apartment.floor != null"><i class="fa-solid fa-stairs" aria-hidden="true"></i>{{ apartment.floor }} <span>Floor</span></span>
      <span *ngIf="apartment.sizeSquareMeters"><i class="fa-solid fa-ruler-combined" aria-hidden="true"></i>{{ apartment.sizeSquareMeters }} m²</span>
    </div>
    <p class="search-name" *ngIf="searchName"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>{{ searchName }}</span></p>
    <a class="view-details" [routerLink]="['/apartments', apartment.id]" (click)="opened.emit(apartment)">View details</a>
  </div>
</article>
