<span class="price-display">
  <span class="primary-price">
    <span aria-hidden="true">$</span>{{ usdPrice | number:'1.0-0' }}
    <small *ngIf="suffix">{{ suffix }}</small>
  </span>
  <span class="approximate-price">
    Approx. <b>₾{{ (usdPrice * usdGelRate) | number:'1.0-0' }}</b>
  </span>
</span>
